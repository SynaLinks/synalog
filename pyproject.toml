[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "synalog"
version = "2.0.0"
description = "Logic programming for AI agents: Datalog-family language compiling to optimized SQL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Synalinks" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
]

# duckdb (the default engine) and psycopg (PostgreSQL) are core dependencies,
# so `synalog … run` works out of the box on a bare `pip install synalog`.
# psycopg[binary] bundles libpq in its wheels, which exist for CPython on
# x86_64 and arm64 (macOS, Linux glibc and musl, Windows): plain psycopg needs
# the system's libpq, which macOS lacks. Elsewhere (armv7, s390x, ppc64le,
# PyPy) psycopg-binary has no wheel, so plain psycopg and the system's libpq.
dependencies = [
    "click>=8.1",
    "rich>=13",
    "duckdb",
    "psycopg[binary]>=3.1; platform_python_implementation == 'CPython' and platform_machine in 'x86_64 AMD64 arm64 aarch64'",
    "psycopg>=3.1; platform_python_implementation != 'CPython' or platform_machine not in 'x86_64 AMD64 arm64 aarch64'",
    "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/synalinks/synalog"

[project.scripts]
synalog = "synalog.cli:main"

[project.optional-dependencies]
# duckdb, sqlite (stdlib) and psql work out of the box. Each other remote
# engine brings its own driver.
trino = ["trino"]
presto = ["presto-python-client"]
databricks = ["databricks-sql-connector"]
bigquery = ["google-cloud-bigquery"]
# Every engine driver at once.
all-engines = [
    "trino",
    "presto-python-client",
    "databricks-sql-connector",
    "google-cloud-bigquery",
]

[dependency-groups]
# Dev tooling installed by `uv sync`: tests (pytest, duckdb, logica also
# provides the sqlite runtime UDFs), benchmarks (logica, matplotlib), docs
# (zensical builds the site, duckdb runs the examples). The remote-engine
# drivers let the e2e suite reach the docker-compose servers instead of
# skipping them: psycopg→PostgreSQL, trino→Trino, presto→Presto, and
# pyhive+thrift→the Spark Thrift Server (the open-source Databricks stand-in,
# reached over NOSASL).
dev = [
    "pytest",
    "duckdb",
    "logica",
    "matplotlib",
    "zensical",
    "psycopg",
    "trino",
    "presto-python-client",
    "pyhive",
    "thrift",
]

[tool.maturin]
features = ["python", "pyo3/extension-module"]
module-name = "synalog._synalog"
python-source = "python"
# Keep the sdist lean: sources + license + readme only.
exclude = [
    "tests/**",
    "benchmark.py",
    "plot_benchmark.py",
    "benchmark_results.json",
    "benchmark_plots/**",
    "dist/**",
    "/CLAUDE.md",
    "shell/**",
    ".github/**",
]
