[package]
name = "synalog"
version = "2.1.0"
edition = "2024"
description = "Logic programming for AI agents: Datalog-family language compiling to optimized SQL"
license = "Apache-2.0"
repository = "https://github.com/synalinks/synalog"
homepage = "https://synalinks.github.io/synalog/"
documentation = "https://docs.rs/synalog"
readme = "README.md"
keywords = ["datalog", "logic-programming", "sql", "compiler", "query"]
categories = ["compilers", "database", "parser-implementations"]
# What ships to crates.io: the library sources plus the legal/readme files.
# Everything else in the repository (Python package, docs site, benchmarks,
# golden test fixtures, CI) is irrelevant to a Rust consumer.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
name = "synalog"
crate-type = ["cdylib", "rlib"]

[features]
# No default features: `cargo add synalog` gives a plain Rust library (parser,
# verifier, compiler). The bindings below are opt-in; maturin selects `python`
# via pyproject.toml, so wheel builds are unaffected.
default = []
# Python extension module (built by maturin). Pulls in pyo3.
python = ["dep:pyo3"]
# Browser playground: compiles the parser + compiler to wasm via wasm-bindgen.
# Build with: --no-default-features --features wasm
wasm = ["dep:wasm-bindgen"]
run = ["rusqlite", "duckdb", "postgres-db", "bigquery-db"]
postgres-db = ["postgres"]
bigquery-db = ["reqwest"]

[dependencies]
indexmap = "2"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
pyo3 = { version = "0.29", optional = true, features = ["extension-module", "abi3-py310"] }
wasm-bindgen = { version = "0.2", optional = true }
rusqlite = { version = "0.34", optional = true, features = ["bundled"] }
duckdb = { version = "1.2", optional = true, features = ["bundled"] }
postgres = { version = "0.19", optional = true }
reqwest = { version = "0.12", optional = true, features = ["blocking", "json"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
regex = "1.12.3"
